<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keeper</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="settings-panel" aria-labelledby="settingsTitle">
        <h1 class="settings-title" id="settingsTitle">设置</h1>
        <div class="settings-groups">
          <section class="settings-group" aria-labelledby="characterSettingsTitle">
            <h2 class="settings-group-title" id="characterSettingsTitle">角色设置</h2>
            <label class="setting-row" for="currentPetSelect">
              <span>当前角色</span>
              <select id="currentPetSelect"></select>
            </label>
          </section>

          <section class="settings-group" aria-labelledby="aiSettingsTitle">
            <h2 class="settings-group-title" id="aiSettingsTitle">AI 配置</h2>
            <label class="setting-row" for="aiProviderSelect">
              <span>服务商</span>
              <select id="aiProviderSelect"></select>
            </label>
            <label class="setting-row" for="aiModelInput">
              <span>模型</span>
              <input id="aiModelInput" autocomplete="off" />
            </label>
            <label class="setting-row" for="aiBaseUrlInput">
              <span>Base URL</span>
              <input id="aiBaseUrlInput" autocomplete="off" />
            </label>
            <label class="setting-row" for="aiApiKeyInput">
              <span>API Key</span>
              <input id="aiApiKeyInput" autocomplete="off" type="password" />
            </label>
            <div class="settings-inline-actions">
              <span class="settings-status" id="aiConfigStatus">未配置</span>
              <button class="primary-button" id="saveAiConfigButton" type="button">保存</button>
            </div>
          </section>
        </div>
      </section>

      <section class="preview-panel" aria-label="keeper preview">
        <img
          class="keeper-preview"
          id="keeperPreview"
          src="../assets/pets/ice-slime/idle/idle.apng"
          alt="待机状态的冰史莱姆"
        />
      </section>

      <section class="status-panel" aria-labelledby="statusTitle">
        <h2 class="sr-only" id="statusTitle">keeper状态</h2>
        <dl class="status-list">
          <div class="status-row">
            <dt>等级</dt>
            <dd id="levelStat">01/99</dd>
          </div>
          <div class="status-row">
            <dt>生命</dt>
            <dd id="lifeStat">01/99</dd>
          </div>
          <div class="status-row">
            <dt>攻击</dt>
            <dd id="attackStat">01/99</dd>
          </div>
          <div class="status-row">
            <dt>防御</dt>
            <dd id="defenseStat">01/99</dd>
          </div>
        </dl>
      </section>

      <section class="log-panel" aria-labelledby="logTitle">
        <h2 class="sr-only" id="logTitle">keeper行为记录</h2>
        <ul class="action-log" id="actionLog" aria-live="polite"></ul>
      </section>
    </main>

    <script src="./renderer.js"></script>
  </body>
</html>
